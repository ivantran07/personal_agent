[project]
name = "personal-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.14.4",
    "litellm>=1.91.2",
    "pgserver>=0.1.4",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "trafilatura>=2.1.0",
]

[project.scripts]
personal-agent = "main:cli"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["logging_config", "main"]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ty.src]
exclude = ["tests"]
